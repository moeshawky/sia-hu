[project]
name = "capture-proxy"
version = "0.2.0"
description = "Capture proxy for llama.cpp — logs raw JSONL of all requests/responses"
readme = "README.md"
requires-python = ">=3.10"
# PROVISIONAL — not MIT, not an open-source license, not a grant. The LICENSE
# file is a placeholder pending three open decisions (licensor, package name,
# commercial threshold). `LicenseRef-` is the PEP 639 form for a custom,
# non-SPDX identifier; it keeps METADATA honest by refusing to claim MIT while
# the file says draft. Verified 2026-10-17: uv_build 0.11.25 emits
# `License-Expression: LicenseRef-Provisional`. Replace when a holder, a name,
# and the commercial terms are settled.
license = "LicenseRef-Provisional"
# PEP 639: ships LICENSE in the sdist and in the wheel's
# <name>-<version>.dist-info/licenses/ with a `License-File:` METADATA entry
# (uv_build 0.11.25 honors `project.license-files`; verified 2026-10-17).
license-files = ["LICENSE"]
authors = [{ name = "moe", email = "moe@libermoe.com" }]
keywords = [
    "openai",
    "proxy",
    "capture",
    "llm",
    "observability",
    "vllm",
    "llama.cpp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "httpx>=0.28",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6",
    "mypy>=1.13",
    "ruff>=0.9",
]

[project.scripts]
capture-proxy = "capture_proxy.__main__:main"

# Verified 2026-10-17: `git ls-remote --heads origin` exits 0 against this
# Gitea host (credentials stripped from the remote URL). The host is a
# tunnel — see GAP list if it ever stops resolving.
[project.urls]
Repository = "http://tunnel.prankh.libermoe.com:26003/moe/capture-proxy"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 88
# .pi/ is agentic tooling (skills/scripts), not the package.
extend-exclude = [".pi"]

[tool.ruff.lint]
select = [
    "E", "W", "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
    "S",
    "C4",
    "RET",
    "TC",
    "FA",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Test files: assert is the testing idiom (S101); local test servers bind
# 0.0.0.0 deliberately (S104); the R-01 runtime-purity probes must launch a
# clean interpreter in a subprocess to observe sys.modules (S603).
"tests/*" = ["S101", "S104", "S603"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.uv]
# Keep the uv cache on the same filesystem as .venv so uv can hardlink
# instead of falling back to slow copies. (Kaggle splits them: the default
# cache lives on the overlay root while the project lives on a loop
# device, and hardlinks cannot cross filesystems.) The cache sits in a
# SIBLING of the repo root — same filesystem, but outside the build
# source: a cache inside the source directory makes `uv build` refuse to
# run (measured 2026-10-17). The router .gitignore already covers
# .uv-cache/.
cache-dir = "../.uv-cache"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "mypy>=1.13",
    "ruff>=0.9",
    "model_headroom",
]
headroom = [
    "torch",
    "safetensors",
]

# The 48 EMO-001 cross-repo tests in tests/test_headroom_emo_support.py import
# the authority's loader at module scope, which imports torch at module scope
# (model_headroom/src/model_headroom/models/loader.py:8). Dev-only and editable:
# the runtime must never resolve model_headroom — R-01 off-mode purity keeps
# `import capture_proxy` free of both torch and model_headroom.
[tool.uv.sources]
model_headroom = { path = "../model_headroom", editable = true }
