name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sia-hu
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build
        run: uv build
      - name: Check distribution
        run: uv run --with twine twine check dist/*
      - name: Inspect wheel contents
        run: uv run python -c "import glob, zipfile; whl = glob.glob('dist/*.whl')[0]; z = zipfile.ZipFile(whl); [print(name) for name in z.namelist()]"
      - name: Publish
        run: uv publish