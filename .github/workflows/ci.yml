name: CI

on:
  push:
    branches: [main, public-repo]
  pull_request:
    branches: [main, public-repo]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra dev --extra headroom --extra gguf
      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src/
      - name: Tests
        run: uv run pytest -q